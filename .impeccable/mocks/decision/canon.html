<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:#0b0620;color:#fff;font-family:'Hanken Grotesk',sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 34% 12%,#fff,transparent),radial-gradient(2px 2px at 66% 18%,#fff,transparent),radial-gradient(1px 1px at 86% 32%,#fff,transparent),radial-gradient(ellipse 60% 50% at 50% 40%,#3b1a8f,transparent)}
.planet{position:absolute;left:50%;top:-250px;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:radial-gradient(circle at 35% 70%,#c4b5fd,#6d28d9 45%,#1e0b4f 75%);opacity:.8}
nav{position:absolute;top:28px;left:64px;right:64px;display:flex;justify-content:space-between;font-size:15px}
nav div{display:flex;gap:32px}
.c{position:absolute;left:50%;top:300px;transform:translateX(-50%);width:880px;text-align:center}
h1{font-size:76px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.c p{font-size:22px;line-height:1.4;margin:22px auto 30px;width:640px;color:#d6ccff}
.btn{display:inline-block;background:#8b5cf6;padding:15px 30px;border-radius:999px;font-weight:600;font-size:18px}
.cards{position:absolute;left:64px;right:64px;bottom:48px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{height:136px;border:1px solid rgba(255,255,255,.16);border-radius:16px;background:rgba(255,255,255,.06);padding:22px;font-size:24px;font-weight:600}
</style></head><body>
<div class="bg"></div><div class="planet"></div>
<nav><span>Cisco NetConnect PUP - Manila</span><div><span>About</span><span>Focus areas</span><span>Events</span><span>Join</span></div></nav>
<div class="c"><h1>Connecting the next generation of network builders</h1><p>A student community at PUP - Manila for networking, cybersecurity, data analytics and IoT.</p><a class="btn">Join NetConnect</a></div>
<div class="cards"><div class="card">Networking</div><div class="card">Cybersecurity</div><div class="card">Data analytics</div><div class="card">IoT</div></div>
</body></html>
